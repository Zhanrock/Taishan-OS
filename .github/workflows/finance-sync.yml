name: Finance Sync

on:
  schedule:
    # Fires 04:17 / 10:17 / 16:17 / 22:17 UTC = 12:17 / 18:17 / 00:17 / 06:17 SGT.
    # Offset from :00 on purpose — GitHub's scheduler queues everything set to
    # fire exactly on the hour (0 */6 * * *), which caused multi-hour delays
    # and occasional skipped runs. Off-the-hour minutes get run much closer
    # to on time. GitHub Actions cron is always evaluated in UTC.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch: {}     # manual "Run workflow" button for testing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r finance-sync/requirements.txt

      - name: Run tests
        working-directory: finance-sync
        run: pytest tests/ -v

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r finance-sync/requirements.txt

      - name: Run sync
        working-directory: finance-sync
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINANCE_USER_ID: ${{ secrets.FINANCE_USER_ID }}
        run: python sync.py
